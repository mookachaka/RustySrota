[package]
name = "rustysrota"
version = "0.1.0"
edition = "2021"
authors = ["mookachaka"]
description = "Computational data architecture based on ternary logic and semantic flow. Grounding the math for glyph system A0-E0."
repository = "https://github.com/mookachaka/RustySrota"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
csv = { version = "1.3", optional = true }

[features]
default = ["io"]
io = ["serde", "serde_json", "csv"]

[lib]

[[bin]]
name = "triangle_demo"
path = "src/bin/triangle_demo.rs"
